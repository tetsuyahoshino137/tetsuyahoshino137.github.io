<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      color: #222;
      margin: 0;
      padding: 0;
      background: #fff;
      line-height: 1.4;
    }

    /* Header */
    header {
      border-top: 4px solid #4a7ab5;
      padding: 14px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header .site-title {
      font-size: 1.2em;
      font-weight: bold;
    }

    nav a {
      text-decoration: none;
      color: #222;
      margin-left: 14px;
      font-size: 1em;
    }

    nav a.active {
      text-decoration: underline;
      font-weight: bold;
    }

    nav .sep {
      color: #aaa;
      margin-left: 14px;
    }

    /* Main */
    main {
      max-width: 860px;
      margin: 40px auto;
      padding: 0 30px;
    }

    /* Profile */
    .profile {
      display: flex;
      gap: 40px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .profile img {
      width: 200px;
      height: 260px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .profile-info h1 {
      font-size: 1.6em;
      margin: 0 0 12px 0;
    }

    .profile-info p {
      margin: 0 0 16px 0;
    }

    .profile-info ul {
      list-style: none;
      padding: 0;
      margin: 0 0 16px 0;
    }

    .profile-info ul li {
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon { width: 20px; text-align: center; color: #555; }

    .copy-btn {
      font-size: 0.78em;
      padding: 1px 7px;
      border: 1px solid #aaa;
      background: #f5f5f5;
      cursor: pointer;
      border-radius: 2px;
    }

    .upcoming-title {
      display: block;
      margin-bottom: 12px;   /* increase as desired */
    }
    
    .upcoming-list {
      margin: 8px 5px 16px 35px; /* Added more left margin (35px) and bottom spacing */
      padding: 0;
      list-style-type: disc;   /* This ensures the bullets appear */
    }
    
    .upcoming-list li { 
      margin-bottom: 5px; 
      display: list-item;      /* Ensures it behaves like a standard list */
    }
    
    /* Divider */
    hr {
      border: none;
      border-top: 1px solid #ccc;
      margin: 36px 0;
    }

    /* Sections */
    h2 {
      font-size: 1.25em;
      margin: 0 0 14px 0;
    }

    main ul {
      padding-left: 20px;   /* ← 好みに応じて 14–22px */
    }
    
    ul.papers {
      padding-left: 5px;
      margin: 0;
    }

    ul.papers li {
      margin-bottom: 0px;
      line-height: 1.2;
    }

    a { color: #1a5296; }

    em { font-style: italic; }

    .red, .red a { color: #c0392b; }
    .journal { color: #c0392b; }
    .journal a { color: #c0392b; }

    /* Mobile */
    @media (max-width: 600px) {
      header { padding: 12px 16px; }
      main { padding: 0 16px; margin: 24px auto; }
      .profile { flex-direction: column; gap: 20px; }
      .profile img { width: 150px; height: 195px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="site-title">{{ site.title }}</div>
    <nav>
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
      <span class="sep">·</span>
      <a href="{{ '/posts' | relative_url }}" {% if page.url == '/posts' or page.url == '/posts/' %}class="active"{% endif %}>Posts</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

</body>
</html>
