<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      font-size: 16px;
      color: #1a1a18;
      margin: 0;
      padding: 0;
      background: #F9F7F3;
      line-height: 1.4;
    }

    /* Header */
    header {
      border-top: 4px solid #C15F3C;
    }

    .header-inner {
      max-width: 820px;
      margin: 0 auto;
      padding: 14px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header .site-title {
      font-size: 1.2em;
      font-weight: bold;
    }

    nav a {
      text-decoration: none;
      color: #1a1a18;
      margin-left: 14px;
      font-size: 1em;
    }

    nav a.active {
      text-decoration: underline;
      font-weight: bold;
    }

    nav .sep {
      color: #aaa;
      margin-left: 14px;
    }

    /* Main */
    main {
      max-width: 820px;
      margin: 40px auto;
      padding: 0 30px;
    }

    /* Profile */
    .profile {
      display: flex;
      gap: 40px;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }

    .profile img {
      width: 200px;
      height: 260px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .profile-info h1 {
      font-size: 1.6em;
      margin: 0 0 12px 0;
    }

    .profile-info p {
      margin: 0 0 16px 0;
    }

    .profile-info ul {
      list-style: none;
      padding: 0;
      margin: 0 0 16px 0;
    }

    .profile-info ul li {
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon { width: 20px; text-align: center; color: #555; }

    .copy-btn {
      font-size: 0.78em;
      padding: 1px 7px;
      border: 1px solid #aaa;
      background: #f5f5f5;
      cursor: pointer;
      border-radius: 2px;
    }

    .upcoming-title {
      margin: 8px 0 6px 0;
    }

    .upcoming-list {
      list-style: disc;
      padding: 0;
      margin: 0 0 12px 22px;
    }

    .upcoming-list li {
      display: list-item;
      margin: 0 0 2px 0;
    }
    
    /* Divider */
    hr {
      border: none;
      border-top: 1px solid #e7ddd0;
      margin: 20px 0;
    }

    /* Sections */
    h2 {
      font-size: 1.25em;
      margin: 0 0 14px 0;
    }

    main ul {
      padding-left: 20px;   /* ← 好みに応じて 14–22px */
    }

    /* Tighten markdown list spacing in Working Papers / Publications */
    main li {
      margin-bottom: 4px;
    }

    main li p {
      margin: 0;
    }
    
    ul.papers {
      padding-left: 5px;
      margin: 0;
    }

    ul.papers li {
      margin-bottom: 0px;
      line-height: 1.2;
    }

    a { color: #C15F3C; }

    em { font-style: italic; }

    .red, .red a { color: #246B5E; }
    .journal { color: #246B5E; }
    .journal a { color: #246B5E; }

    .jp-posts {
      list-style: none;
      padding: 0;
      margin: 12px 0 0 0;
    }

    .jp-posts li {
      display: flex;
      gap: 14px;
      align-items: baseline;
      border-bottom: 1px solid #e7ddd0;
      padding: 8px 0;
      margin: 0;
    }

    .post-date {
      color: #666;
      font-size: 0.95em;
      min-width: 92px;
      font-variant-numeric: tabular-nums;
    }

    .post-title {
      color: #1a1a18;
    }

    .post-page main ul li {
      font-size: 0.92em;
      line-height: 1.35;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .header-inner { padding: 12px 16px; }
      main { padding: 0 16px; margin: 24px auto; }
      .profile { flex-direction: column; gap: 20px; }
      .profile img { width: 150px; height: 195px; }
      .jp-posts li { flex-direction: column; gap: 2px; }
      .post-date { min-width: 0; }
    }
  </style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body{% if page.permalink == '/posts/' or page.permalink contains '/日本語/' %} class="post-page"{% endif %}>

  <header>
    <div class="header-inner">
      <div class="site-title">{{ site.title }}</div>
      <nav>
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <span class="sep">·</span>
        <a href="{{ '/posts' | relative_url }}" {% if page.url == '/posts' or page.url == '/posts/' %}class="active"{% endif %}>日本語</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

</body>
</html>
